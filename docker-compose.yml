services:
  cfhost:
    build: .
    container_name: cfhost
    restart: unless-stopped
    ports:
      - "9876:8080"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      CFST_BIN: /app/cfst
      CFST_IP_FILE: /app/ip.txt
      CFST_IPV6_FILE: /app/ipv6.txt
      HOSTS_PATH: /host/etc/hosts
    volumes:
      - ./data:/data
      - /etc/hosts:/host/etc/hosts
