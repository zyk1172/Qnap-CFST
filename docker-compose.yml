services:
  cfhost:
    build: .
    container_name: cfhost
    restart: unless-stopped
    ports:
      - "${CFHOST_PORT:-9876}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      CFST_BIN: /app/cfst
      CFST_IP_FILE: /app/ip.txt
      CFST_IPV6_FILE: /app/ipv6.txt
      HOSTS_PATH: /host/etc/hosts
      HOSTS_VERIFY_PATH: /host/etc-check/hosts
    volumes:
      - ${CFHOST_DATA_DIR:-./data}:/data
      - ${CFHOST_HOSTS_FILE:-/etc/hosts}:/host/etc/hosts
      - ${CFHOST_HOSTS_DIR:-/etc}:/host/etc-check:ro
    stop_grace_period: 15s
