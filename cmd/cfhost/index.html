<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFHost</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#15181c;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--good:#15803d;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--text:#f5f7fa;--muted:#98a2b3;--line:#2b3038;--accent:#60a5fa;--good:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:28px;margin:0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}.metric{font-size:24px;font-weight:650}.muted{color:var(--muted)}section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:17px;margin:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted);font-weight:600}input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.wide{grid-column:span 2}.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto}.status-good{color:var(--good)}.status-bad{color:var(--bad)}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--bg);padding:12px;border-radius:9px;margin:0}.scroll{overflow:auto}.tiny{font-size:12px}.pill{display:inline-block;padding:2px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}@media(max-width:850px){.grid,.form-grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>CFHost</h1><div class="sub">Cloudflare 优选 · 智能 Repair · Hosts 管理</div></div>
    <div class="actions">
      <button onclick="job('run')">强制 CFST 测速</button>
      <button class="primary" onclick="job('repair')">智能 Repair</button>
      <button onclick="job('optimize')">完整优化</button>
      <button onclick="applyHosts()">应用 Hosts</button>
      <button onclick="syncGitHub()">同步 GitHub</button>
    </div>
  </div>

  <div class="grid">
    <div class="card"><div class="muted">运行状态</div><div id="runState" class="metric">-</div></div>
    <div class="card"><div class="muted">缓存候选 IP</div><div id="candidateCount" class="metric">0</div></div>
    <div class="card"><div class="muted">已解析域名</div><div id="mappingCount" class="metric">0</div></div>
    <div class="card"><div class="muted">最近完整测速</div><div id="lastRefresh" class="metric tiny">-</div><div id="nextRefresh" class="muted tiny"></div><div id="lastOptimize" class="muted tiny"></div></div>
  </div>

  <section class="card">
    <div class="section-head"><h2>设置</h2><button class="primary" onclick="saveConfig()">保存设置</button></div>
    <div class="form-grid">
      <div class="field"><label>延迟上限 ms</label><input id="maxDelay" type="number"></div>
      <div class="field"><label>最低下载速度 MB/s</label><input id="minSpeed" type="number" step="0.1"></div>
      <div class="field"><label>最大丢包率 0~1</label><input id="maxLoss" type="number" step="0.01"></div>
      <div class="field"><label>下载测速数量</label><input id="downloadCount" type="number"></div>
      <div class="field"><label>测速线程</label><input id="threads" type="number"></div>
      <div class="field"><label>Ping 次数</label><input id="pingTimes" type="number"></div>
      <div class="field"><label>单 IP 下载秒数</label><input id="downloadSeconds" type="number"></div>
      <div class="field"><label>验证超时秒数</label><input id="verifyTimeout" type="number"></div>
      <div class="field"><label>HTTP 验证重试</label><input id="httpRetries" type="number"></div>
      <div class="field"><label>每域名最多候选</label><input id="candidateLimit" type="number"></div>
      <div class="field"><label>HTTP 200 最小正文 bytes</label><input id="minBodyBytes" type="number"></div>
      <div class="field"><label>最大跳转次数</label><input id="maxRedirects" type="number"></div>
      <div class="field wide"><label>挑战页 / 占位页匹配规则</label><input id="blockPatterns"></div>
      <div class="field wide"><label>下载测速 URL</label><input id="downloadUrl"></div>
      <div class="field"><label>Repair 间隔（分钟）</label><input id="repairInterval" type="number"></div>
      <div class="field"><label>候选缓存 TTL（分钟）</label><input id="candidateTTL" type="number"></div>
      <div class="field"><label>触发完整测速的连续失败次数</label><input id="failureThreshold" type="number"></div>
      <div class="field"><label>完整测速基础冷却（分钟）</label><input id="refreshCooldown" type="number"></div>
      <div class="field"><label>完整测速最大退避（分钟）</label><input id="refreshMaxBackoff" type="number"></div>
      <div class="field"><label>Hosts 路径</label><input id="hostsPath"></div>
      <div class="field"><label>Hosts 备份保留数量</label><input id="backupRetention" type="number"></div>
      <div class="field wide"><label>旧 hosts-map.tsv 导入路径</label><input id="legacyStateMap"></div>
      <div class="field"><label>Bandwidth 最大延迟 ms</label><input id="bwMaxDelay" type="number"></div>
      <div class="field"><label>Bandwidth 最大丢包率</label><input id="bwMaxLoss" type="number" step="0.01"></div>
      <div class="field"><label>Bandwidth 最低速度 MB/s</label><input id="bwMinSpeed" type="number" step="0.1"></div>
      <div class="field"><label>完整优化间隔（分钟）</label><input id="optimizeInterval" type="number"></div>
      <div class="field"><label>优化失败重试（分钟）</label><input id="optimizeRetry" type="number"></div>
      <div class="field wide"><label>Tracker 样本文件</label><input id="trackerSamples"></div>
      <div class="field"><label>Tracker announce 重试</label><input id="trackerRetries" type="number"></div>
      <div class="field switch"><input id="realAnnounce" type="checkbox"><label for="realAnnounce">Tracker 真实 announce</label></div>
      <div class="field switch"><input id="strictHttp" type="checkbox"><label for="strictHttp">普通 HTTP 严格验证</label></div>
      <div class="field switch"><input id="autoOptimize" type="checkbox"><label for="autoOptimize">每日完整优化</label></div>
      <div class="field switch"><input id="autoRepair" type="checkbox"><label for="autoRepair">自动 Repair</label></div>
      <div class="field switch"><input id="autoApply" type="checkbox"><label for="autoApply">Repair 后自动写 Hosts</label></div>
      <div class="field switch"><input id="ipv6" type="checkbox"><label for="ipv6">使用 IPv6 IP 池</label></div>
      <div class="field switch"><input id="syncEnabled" type="checkbox"><label for="syncEnabled">GitHub 自动同步</label></div>
      <div class="field wide"><label>同步仓库</label><input id="syncRepo"></div>
      <div class="field"><label>同步分支</label><input id="syncBranch"></div>
      <div class="field wide"><label>GitHub Token 文件</label><input id="syncTokenFile"></div>
    </div>
  </section>

  <section class="card">
    <div class="section-head"><div><h2>域名</h2><div class="muted tiny">Repair 先验证当前 IP，再尝试有效期内的候选缓存。Tracker 开启真实 announce 后，缺少样本不会触发无意义的 CFST 重测速。</div></div><button onclick="addDomain()">添加</button></div>
    <div class="scroll"><table><thead><tr><th>启用</th><th>域名</th><th>站点组</th><th>类别</th><th>类型</th><th>路径</th><th></th></tr></thead><tbody id="domains"></tbody></table></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>当前映射</h2><span id="lastError" class="status-bad"></span></div>
    <div class="scroll"><table><thead><tr><th>域名</th><th>IP</th><th>连续失败</th><th>状态</th></tr></thead><tbody id="mappings"></tbody></table></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>CFST 候选结果</h2></div>
    <div class="scroll"><table><thead><tr><th>IP</th><th>丢包率</th><th>延迟 ms</th><th>速度 MB/s</th><th>地区</th><th>采样时间</th></tr></thead><tbody id="candidates"></tbody></table></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>GitHub 同步</h2></div>
    <div id="syncState" class="tiny">-</div>
    <div class="muted tiny">最近 commit：<span id="syncCommit">-</span></div>
  </section>

  <section class="card">
    <div class="section-head"><h2>运行历史</h2></div>
    <div class="scroll"><table><thead><tr><th>任务</th><th>开始</th><th>耗时</th><th>结果</th><th>完整 CFST</th><th>映射</th><th>候选</th></tr></thead><tbody id="history"></tbody></table></div>
  </section>

  <section class="card"><div class="section-head"><h2>日志</h2></div><pre id="logs"></pre></section>
</div>
<script>
let config=null,state=null;
const $=id=>document.getElementById(id);
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():null}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function refresh(){
  try{
    [config,state]=await Promise.all([api('/api/config'),api('/api/status')]);
    render();
  }catch(e){$('lastError').textContent=e.message}
}
function render(){
  $('runState').textContent=state.running?(state.currentJob||'运行中'):'空闲';
  $('runState').className='metric '+(state.running?'status-good':'');
  $('candidateCount').textContent=(state.candidates||[]).length;
  $('mappingCount').textContent=Object.keys(state.mappings||{}).length;
  $('lastRefresh').textContent=state.lastRefresh||'-';
  $('lastOptimize').textContent=state.lastOptimize?('最近优化：'+state.lastOptimize):'';
  $('nextRefresh').textContent=state.nextRefresh?('下次最早：'+state.nextRefresh):'';
  $('lastError').textContent=state.lastError||'';
  $('maxDelay').value=config.cfst.maxDelayMs;$('minSpeed').value=config.cfst.minSpeedMB;$('maxLoss').value=config.cfst.maxLossRate;
  $('downloadCount').value=config.cfst.downloadCount;$('threads').value=config.cfst.threads;$('pingTimes').value=config.cfst.pingTimes;
  $('downloadSeconds').value=config.cfst.downloadSeconds;$('verifyTimeout').value=config.verifyTimeoutSeconds;$('downloadUrl').value=config.cfst.downloadUrl;
  $('httpRetries').value=config.verify.httpRetries;$('candidateLimit').value=config.verify.candidateLimit;$('minBodyBytes').value=config.verify.minBodyBytes;$('maxRedirects').value=config.verify.maxRedirects;$('blockPatterns').value=config.verify.blockPatterns;$('strictHttp').checked=config.verify.strictHttp;
  $('repairInterval').value=config.repairIntervalMinutes;$('candidateTTL').value=config.repair.candidateTTLMinutes;
  $('failureThreshold').value=config.repair.failureThreshold;$('refreshCooldown').value=config.repair.refreshCooldownMinutes;
  $('refreshMaxBackoff').value=config.repair.refreshMaxBackoffMinutes;$('hostsPath').value=config.hostsPath;
  $('backupRetention').value=config.hosts.backupRetention;$('legacyStateMap').value=config.hosts.legacyStateMapPath;
  $('bwMaxDelay').value=config.bandwidth.maxDelayMs;$('bwMaxLoss').value=config.bandwidth.maxLossRate;$('bwMinSpeed').value=config.bandwidth.minSpeedMB;
  $('autoOptimize').checked=config.optimize.enabled;$('optimizeInterval').value=config.optimize.intervalMinutes;$('optimizeRetry').value=config.optimize.retryMinutes;
  $('trackerSamples').value=config.tracker.samplesPath;$('trackerRetries').value=config.tracker.retries;$('realAnnounce').checked=config.tracker.realAnnounce;
  $('autoRepair').checked=config.autoRepair;$('autoApply').checked=config.autoApply;$('ipv6').checked=config.cfst.ipv6;
  $('syncEnabled').checked=config.sync.enabled;$('syncRepo').value=config.sync.repository;$('syncBranch').value=config.sync.branch;$('syncTokenFile').value=config.sync.tokenFile;
  renderDomains();renderMappings();renderCandidates();renderOps();renderHistory();$('logs').textContent=(state.logs||[]).join('\n');
}
function renderDomains(){
  $('domains').innerHTML=(config.domains||[]).map((d,i)=>`<tr>
    <td><input style="width:auto" type="checkbox" data-k="enabled" data-i="${i}" ${d.enabled?'checked':''}></td>
    <td><input data-k="host" data-i="${i}" value="${esc(d.host)}"></td>
    <td><input data-k="group" data-i="${i}" value="${esc(d.group)}"></td>
    <td><select data-k="class" data-i="${i}"><option value="latency" ${d.class!=='bandwidth'?'selected':''}>latency</option><option value="bandwidth" ${d.class==='bandwidth'?'selected':''}>bandwidth</option></select></td>
    <td><select data-k="mode" data-i="${i}"><option value="http" ${d.mode==='http'?'selected':''}>HTTP</option><option value="tracker" ${d.mode==='tracker'?'selected':''}>Tracker</option></select></td>
    <td><input data-k="endpoint" data-i="${i}" value="${esc(d.endpoint)}"></td>
    <td><button class="danger" onclick="removeDomain(${i})">删除</button></td></tr>`).join('');
}
function renderMappings(){
  const m=state.mappings||{},s=state.domainStatus||{},h=state.domainHealth||{};
  const hosts=[...new Set([...(config.domains||[]).map(x=>x.host),...Object.keys(m)])];
  $('mappings').innerHTML=hosts.map(host=>`<tr><td>${esc(host)}</td><td><span class="pill">${esc(m[host]||'-')}</span></td><td>${h[host]?.failureStreak||0}</td><td class="tiny">${esc(s[host]||'-')}</td></tr>`).join('');
}
function renderCandidates(){
  $('candidates').innerHTML=(state.candidates||[]).slice(0,30).map(c=>`<tr><td>${esc(c.ip)}</td><td>${c.lossRate}</td><td>${c.delayMs}</td><td>${c.speedMB}</td><td>${esc(c.colo)}</td><td class="tiny">${esc(c.observedAt||'-')}</td></tr>`).join('');
}
function syncDomainInputs(){
  document.querySelectorAll('#domains [data-i]').forEach(el=>{
    const i=Number(el.dataset.i),k=el.dataset.k;
    config.domains[i][k]=el.type==='checkbox'?el.checked:el.value;
  });
}
function addDomain(){syncDomainInputs();config.domains.push({host:'',group:'',class:'latency',mode:'http',endpoint:'/',enabled:true});renderDomains()}
function removeDomain(i){syncDomainInputs();config.domains.splice(i,1);renderDomains()}
async function saveConfig(){
  try{
    syncDomainInputs();
    config.cfst.maxDelayMs=Number($('maxDelay').value);config.cfst.minSpeedMB=Number($('minSpeed').value);config.cfst.maxLossRate=Number($('maxLoss').value);
    config.cfst.downloadCount=Number($('downloadCount').value);config.cfst.threads=Number($('threads').value);config.cfst.pingTimes=Number($('pingTimes').value);
    config.cfst.downloadSeconds=Number($('downloadSeconds').value);config.verifyTimeoutSeconds=Number($('verifyTimeout').value);config.cfst.downloadUrl=$('downloadUrl').value;
    config.verify.httpRetries=Number($('httpRetries').value);config.verify.candidateLimit=Number($('candidateLimit').value);config.verify.minBodyBytes=Number($('minBodyBytes').value);config.verify.maxRedirects=Number($('maxRedirects').value);config.verify.blockPatterns=$('blockPatterns').value;config.verify.strictHttp=$('strictHttp').checked;
    config.repairIntervalMinutes=Number($('repairInterval').value);config.repair.candidateTTLMinutes=Number($('candidateTTL').value);
    config.repair.failureThreshold=Number($('failureThreshold').value);config.repair.refreshCooldownMinutes=Number($('refreshCooldown').value);
    config.repair.refreshMaxBackoffMinutes=Number($('refreshMaxBackoff').value);config.hostsPath=$('hostsPath').value;
    config.hosts.backupRetention=Number($('backupRetention').value);config.hosts.legacyStateMapPath=$('legacyStateMap').value;
    config.bandwidth.maxDelayMs=Number($('bwMaxDelay').value);config.bandwidth.maxLossRate=Number($('bwMaxLoss').value);config.bandwidth.minSpeedMB=Number($('bwMinSpeed').value);
    config.optimize.enabled=$('autoOptimize').checked;config.optimize.intervalMinutes=Number($('optimizeInterval').value);config.optimize.retryMinutes=Number($('optimizeRetry').value);
    config.tracker.samplesPath=$('trackerSamples').value;config.tracker.retries=Number($('trackerRetries').value);config.tracker.realAnnounce=$('realAnnounce').checked;
    config.sync.enabled=$('syncEnabled').checked;config.sync.repository=$('syncRepo').value;config.sync.branch=$('syncBranch').value;config.sync.tokenFile=$('syncTokenFile').value;
    config.autoRepair=$('autoRepair').checked;config.autoApply=$('autoApply').checked;config.cfst.ipv6=$('ipv6').checked;
    config=await api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
    await refresh();
  }catch(e){alert(e.message)}
}
async function job(k){try{await api('/api/'+k,{method:'POST'});await refresh()}catch(e){alert(e.message)}}
async function applyHosts(){try{await api('/api/apply',{method:'POST'});await refresh()}catch(e){alert(e.message)}}
async function syncGitHub(){try{await api('/api/sync',{method:'POST'});await refresh()}catch(e){alert(e.message)}}
function renderOps(){
  const s=state.sync||{};
  $('syncState').textContent=s.lastError?('失败：'+s.lastError):(s.lastSuccess?('最近成功：'+s.lastSuccess):'尚未同步');
  $('syncCommit').textContent=s.lastCommit||'-';
}
function renderHistory(){
  $('history').innerHTML=[...(state.history||[])].reverse().slice(0,30).map(r=>`<tr><td>${esc(r.kind)}</td><td>${esc(r.startedAt)}</td><td>${r.durationMs} ms</td><td>${r.success?'成功':'失败'}</td><td>${r.fullRefresh?'是':'否'}</td><td>${r.mappingsBefore} → ${r.mappingsAfter}</td><td>${r.candidateCount}</td></tr>`).join('');
}
refresh();setInterval(async()=>{try{state=await api('/api/status');render()}catch{}},3000);
</script>
</body>
</html>
