# 多架构镜像：由 Docker 自动匹配 linux/amd64 或 linux/arm64。
services:
  cfhost:
    image: ${CFHOST_IMAGE:-ghcr.io/zyk1172/qnap-cfst:cfhost}
    restart: unless-stopped
    ports:
      - "${CFHOST_PORT:-9876}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      HOSTS_PATH: /host/etc/hosts
    volumes:
      - type: bind
        source: ${CFHOST_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ${CFHOST_HOSTS_FILE:-/etc/hosts}
        target: /host/etc/hosts
        read_only: false
        bind:
          create_host_path: false
    stop_grace_period: 15s
