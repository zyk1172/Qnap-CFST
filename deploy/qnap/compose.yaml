services:
  cfhost:
    image: ${CFHOST_IMAGE:-ghcr.io/zyk1172/qnap-cfst:cfhost}
    container_name: cfhost
    restart: unless-stopped
    ports:
      - "${CFHOST_PORT:-9876}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      HOSTS_PATH: /host/etc/hosts
      HOSTS_VERIFY_PATH: /host/etc-check/hosts
    volumes:
      - ${CFHOST_DATA_DIR:-/share/Container/cfhost/data}:/data
      - ${CFHOST_HOSTS_FILE:-/etc/hosts}:/host/etc/hosts
      - ${CFHOST_HOSTS_DIR:-/etc}:/host/etc-check:ro
    stop_grace_period: 15s
