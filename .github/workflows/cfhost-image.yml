name: CFHost Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "cfhost-v*"

concurrency:
  group: cfhost-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/zyk1172/qnap-cfst
          flavor: latest=false
          tags: |
            type=raw,value=cfhost
            type=ref,event=tag
          labels: |
            org.opencontainers.image.description=CFHost for NAS. Bind /etc to /host/etc-check read-only and set HOSTS_VERIFY_PATH=/host/etc-check/hosts. Find all mounts and optional Docker socket setup at https://github.com/zyk1172/Qnap-CFST/blob/master/deploy/README.md
            org.opencontainers.image.documentation=https://github.com/zyk1172/Qnap-CFST/blob/master/deploy/README.md#从镜像创建或升级容器
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
