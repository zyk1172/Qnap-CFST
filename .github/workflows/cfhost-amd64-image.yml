name: CFHost QNAP AMD64 Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "cfhost-amd64-v*"
      - "cfhost-v*"

concurrency:
  group: cfhost-amd64-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zyk1172/qnap-cfst

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        env:
          CFHOST_IMAGE_METADATA: |
            org.opencontainers.image.description=CFHost for NAS. Mount /etc at /host/etc-check read-only and set HOSTS_VERIFY_PATH=/host/etc-check/hosts. Find all mounts and optional Docker socket setup at https://github.com/zyk1172/Qnap-CFST/blob/master/deploy/README.md
            org.opencontainers.image.documentation=https://github.com/zyk1172/Qnap-CFST/blob/master/deploy/README.md#从镜像创建或升级容器
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=cfhost-amd64
            type=raw,value=qnap-amd64
            type=sha,prefix=cfhost-amd64-
            type=match,pattern=^cfhost(?:-amd64)?-v(.*)$,group=1,prefix=cfhost-amd64-v
          labels: ${{ env.CFHOST_IMAGE_METADATA }}
          annotations: ${{ env.CFHOST_IMAGE_METADATA }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=cfhost-amd64
          cache-to: type=gha,mode=max,scope=cfhost-amd64
