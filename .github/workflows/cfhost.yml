name: CFHost

on:
  push:
    branches:
      - master
      - "cfhost/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Validate Web UI JavaScript
        run: |
          node --check cmd/cfhost/web/js/core.js
          node --check cmd/cfhost/web/js/dashboard-domains.js
          node --check cmd/cfhost/web/js/candidates-ops-logs.js
          node --check cmd/cfhost/web/js/settings.js
          node --check cmd/cfhost/web/js/interactions.js
          node --check cmd/cfhost/web/js/events.js
      - run: go test -race ./...
      - run: go build ./...
      - name: Validate NAS Compose profiles
        run: |
          for compose_file in docker-compose.yml deploy/qnap/compose.yaml deploy/qnap/compose-amd64.yaml deploy/synology/compose.yaml deploy/fnos/compose.yaml deploy/generic/compose.yaml; do
            docker compose -f "$compose_file" config --quiet
          done
          for nas in synology fnos generic; do
            docker compose --env-file "deploy/$nas/.env.example" -f "deploy/$nas/compose.yaml" config --quiet
          done
      - name: Build ARM64 binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/cfst-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/cfhost-arm64" ./cmd/cfhost
      - name: Build AMD64 image
        run: docker build --platform linux/amd64 -t cfhost:test .
